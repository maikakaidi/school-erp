services:
  - type: web
    name: api-school
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: |
      cd backend-csp && npm install && npx prisma generate && npx prisma migrate deploy && cd ../frontend-csp && npm install && npm run build
    startCommand: cd backend-csp && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

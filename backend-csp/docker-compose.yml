version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: api_school_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_school
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: api_school_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: